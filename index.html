<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>なるき</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>

  <script src="messages.js"></script>
  <script>
    const app = document.getElementById("app");
    const root = document.documentElement;
    root.style.setProperty("--main", SITE.color);
    root.style.setProperty("--cover-bg", SITE.bg);
    document.title = SITE.name;

    function esc(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // 写真が未設定なら灰色の枠を出す
    function photo(src, cls, label = "写真") {
      return src
        ? `<img class="${cls}" src="${esc(src)}" alt="">`
        : `<div class="${cls} ph">${label}</div>`;
    }

    function show(html, screenClass) {
      app.className = screenClass;
      app.innerHTML = html;
      window.scrollTo(0, 0);
    }

    const envelopeHtml = `
      <div class="env">
        <div class="env-back"></div>
        <div class="env-paper"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="env-seal"></div>
      </div>`;

    /* ① 最初の画面：手紙をタップ */
    function renderCover() {
      show(`
        <section class="screen cover">
          <p class="cover-text">${esc(SITE.name)}さんに<br>メッセージが届いています</p>
          <button class="env-btn" type="button" aria-label="手紙をひらく">
            <span class="ripple" aria-hidden="true"></span>
            ${envelopeHtml}
          </button>
          <p class="tap-hint" aria-hidden="true">
            <svg class="finger" viewBox="0 0 24 24" width="28" height="28"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.7-2.3L4.4 15.6a1.5 1.5 0 0 1 2.3-1.9L9 16" fill="#fff" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>手紙をタップしてね</span>
          </p>
        </section>`, "is-cover");
      app.querySelector(".env-btn").addEventListener("click", renderPassword);
    }

    // スペースを消し、カタカナで入れてもひらがなとして扱う
    function normalize(text) {
      return text.replace(/\s/g, "").replace(/[ァ-ヶ]/g,
        (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
    }

    /* ② パスワード（謎解き） */
    function renderPassword() {
      const len = [...SITE.password.answer].length;
      // groups の区切りごとに改行を入れる（例: [4, 3] → 4文字＋3文字）
      const breaks = new Set();
      (SITE.password.groups || []).reduce((sum, n) => (breaks.add(sum + n), sum + n), 0);
      const boxes = Array.from({ length: len }, (_, i) =>
        `<span class="box"></span>${breaks.has(i + 1) && i + 1 < len ? `<span class="break"></span>` : ""}`).join("");
      show(`
        <section class="screen cover">
          <form class="pw-card" autocomplete="off">
            <p class="pw-hint">${esc(SITE.password.hint)}</p>
            ${photo(SITE.password.image, "pw-image", "謎解き")}
            <p class="pw-q"><span class="q-badge">？</span> の答えは…</p>
            <label class="pw-boxes">
              ${boxes}
              <input class="pw-input" type="text" maxlength="${len}" aria-label="パスワード">
            </label>
            <p class="pw-error" role="alert"></p>
            <button class="pw-submit" type="submit">ひらく</button>
          </form>
        </section>`, "is-cover");

      const form = app.querySelector(".pw-card");
      const input = app.querySelector(".pw-input");
      const boxEls = app.querySelectorAll(".box");
      const error = app.querySelector(".pw-error");

      input.addEventListener("input", () => {
        const chars = [...input.value];
        boxEls.forEach((b, i) => {
          b.textContent = chars[i] || "";
          b.classList.toggle("filled", Boolean(chars[i]));
        });
        error.textContent = "";
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (normalize(input.value) === normalize(SITE.password.answer)) {
          renderOpening();
        } else {
          error.textContent = "ちがうみたい…もう一度考えてみて！";
          form.classList.remove("shake");
          void form.offsetWidth;
          form.classList.add("shake");
        }
      });
      setTimeout(() => input.focus(), 300);
    }

    /* ③ 手紙がひらくアニメーション */
    function renderOpening() {
      show(`<section class="screen cover"><div class="opening">${envelopeHtml}</div></section>`, "is-cover");
      requestAnimationFrame(() => requestAnimationFrame(() =>
        app.querySelector(".opening").classList.add("open")));
      setTimeout(renderLetter, 1900);
    }

    /* ④ 手紙 */
    function renderLetter() {
      const l = SITE.letter;
      show(`
        <section class="screen cover">
          <article class="paper">
            <p class="paper-to">${esc(l.to)}</p>
            <div class="paper-body">${esc(l.body)}</div>
            <p class="paper-from">${esc(l.from)}</p>
            <button class="know-btn" type="button">${esc(SITE.team)}の${esc(SITE.name)}を知る</button>
          </article>
        </section>`, "is-cover");
      app.querySelector(".know-btn").addEventListener("click", renderWorks);
    }

    /* ⑤ 担当・制作物 */
    function renderWorks() {
      const w = SITE.works;
      const cards = w.items.map((item) => {
        const inner = `${photo(item.image, "work-image", "スクリーンショット")}
          <span class="work-title">${esc(item.title)}</span>`;
        if (item.link === "profile") {
          return `<button class="work" type="button" data-profile>${inner}</button>`;
        }
        if (item.link) {
          return `<a class="work" href="${esc(item.link)}" target="_blank" rel="noopener">${inner}</a>`;
        }
        return `<div class="work">${inner}</div>`;
      }).join("");

      show(`
        <section class="works">
          <h2 class="works-label">担当</h2>
          <p class="works-role">${esc(w.role)}</p>
          <h2 class="works-label">制作物</h2>
          <div class="work-list">${cards}</div>
        </section>`, "is-cover");
      app.querySelector("[data-profile]")?.addEventListener("click", renderProfile);
    }

    /* ⑥ プロフィール */
    function renderProfile() {
      const p = SITE.profile;
      const rows = p.items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
      const qa = SITE.qa.map((x, i) => `
        <li class="qa-item ${i % 2 ? "rev" : ""}">
          <p class="qa-q">${esc(x.q)}</p>
          <p class="qa-a">${esc(x.a)}</p>
        </li>`).join("");
      const album = SITE.album.map((src) => photo(src, "album-photo")).join("");

      show(`
        <header class="top-bar">
          <nav>
            <a href="#profile">profile</a>
            <a href="#qa">Q&amp;A</a>
            <a href="#album">album</a>
          </nav>
          <span class="logo">${esc(SITE.logo)}</span>
        </header>

        ${photo(p.photo, "hero", "メイン写真")}

        <section id="profile" class="sec dark">
          <h2 class="sec-title">profile</h2>
          <dl class="profile-table">${rows}</dl>
        </section>

        <section id="qa" class="sec gray">
          <h2 class="sec-title tag">Q&amp;A</h2>
          <ul class="qa-list">${qa}</ul>
        </section>

        <section id="album" class="sec light">
          <h2 class="sec-title">album</h2>
          <div class="album">${album}</div>
        </section>

        <footer class="foot">
          <span>${esc(SITE.logo)}</span>
          <a href="#" class="to-top" aria-label="ページの上へ">▲<br>Top</a>
        </footer>`, "is-profile");

      app.querySelector(".to-top").addEventListener("click", (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    renderCover();
  </script>
</body>
</html>
