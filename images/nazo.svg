<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif">
  <rect width="300" height="300" rx="12" fill="#3c3c3c"/>

  <text x="150" y="32" text-anchor="middle" font-size="14" fill="#bdbdbd" letter-spacing="4">なぞとき</text>

  <!-- かさ → きし -->
