  <text x="182" y="177" font-size="30" font-weight="bold" fill="#fff" letter-spacing="4">のさ</text>

  <line x1="24" y1="210" x2="276" y2="210" stroke="#5c5c5c" stroke-width="2" stroke-dasharray="6 6"/>

