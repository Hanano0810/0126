      <line x1="2" y1="36" x2="16" y2="38"/><line x1="2" y1="44" x2="16" y2="42"/>
      <line x1="66" y1="36" x2="52" y2="38"/><line x1="66" y1="44" x2="52" y2="42"/>
    </g>
  </g>
  <g stroke="#f2b84b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="134" y1="166" x2="166" y2="166"/>
